services:
  - type: web
    name: pokeanime-pokemon-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
  - type: web
    name: pokeanime-anime-api
    runtime: python
    rootDir: anime-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pokeanime
  - type: web
    name: pokeanime-docentes-api
    runtime: node
    rootDir: docentes-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
